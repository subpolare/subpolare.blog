services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: subpolare.ru
      EMAIL: nachatoi@list.ru
      UPSTREAM: blog_app:8000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - blog_app
volumes:
  caddy_data:
  caddy_config: