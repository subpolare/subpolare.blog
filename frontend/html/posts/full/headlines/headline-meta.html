{% load text_filters %}
<span><i class="fa-solid fa-cloud" aria-hidden="true"></i> <time class="dt-published" datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"d E Y"|lower }}</time></span>
{% if request.user.is_superuser %}
    {% with views=post.total_view_count %}
    <span><i class="fa-solid fa-eye" aria-hidden="true"></i> {{ views }} {{ views|rupluralize:"просмотр,просмотра,просмотров" }}</span>
    {% endwith %}
{% endif %}
<span><i class="fa-solid fa-clock" aria-hidden="true"></i> ~{{ post.reading_time }} минут чтения</span>
