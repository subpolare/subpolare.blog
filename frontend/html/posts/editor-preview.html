{% load static %}<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline' http: https:; font-src http: https: data:; img-src http: https: data:; media-src http: https:; frame-src http: https:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
{% include "common/styles.html" %}
{% if post.css %}<style>{{ post.css|safe }}</style>{% endif %}
<style>html { background: var(--bg-color); } .post { padding: 16px; box-sizing: border-box; } .clicker, .inline-comments { pointer-events: none; }</style>
</head><body class="{{ post.data.body_class }}" style="background-color: {{ post.data.background_color }}; color: {{ post.data.color }};">
<div class="post e-content">{{ html|safe }}</div>
</body></html>
