<section class="container">
    {% if block.title %}
        <div class="header-1">
            {% if block.url %}
                <a href="{{ block.url }}">{{ block.title }}</a>
            {% else %}
                {{ block.title }}
            {% endif %}
        </div>
    {% endif %}

    <div class="cards-group cards-group-2x">
        {% for post in block.posts %}
            {% include "posts/cards/horizontal.html" with card_sizes="(width < 650px) calc(100vw - 20px), (min-width: 1000px) 460px, calc(50vw - 40px)" %}
        {% endfor %}
    </div>
</section>
