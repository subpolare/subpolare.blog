limit_req_zone $binary_remote_addr zone=blog_limit:10m rate=3r/s;

server {
    listen 80;
    server_name subpolare.com www.subpolare.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://subpolare.com$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name subpolare.com www.subpolare.com;
    ssl_certificate /etc/letsencrypt/live/subpolare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subpolare.com/privkey.pem;
    client_max_body_size 15M;
    charset utf-8;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $blog_upstream blog_app:8022;
    set $ru_upstream ru_tunnel:8022;
    set $pepic_upstream pepic:8118;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location /static/ { alias /static/; expires 7d; }

    # No uploads, query-driven transforms or administrative Pepic endpoints.
    location ~ "^/media/(?:full/|[0-9]+/)?[a-fA-F0-9]{64}\.(?:jpe?g|png|webp|gif|avif|mp4|webm)$" {
        limit_except GET { deny all; }
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://$pepic_upstream;
        proxy_set_header Host subpolare.com;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=86400";
    }
    location /media/ { return 404; }

    # Old i.subpolare.ru links: originals provide an offline fallback when a
    # requested derivative has not yet been generated on RU.
    location ~ "^/legacy/(?:full/|[0-9]+/)?([a-z0-9]{1,3}\.(?:jpe?g|png|gif|webp))$" {
        alias /legacy/images/max/$1;
        expires 7d;
    }
    location /legacy/ { return 404; }

    location /clickers/ {
        limit_req zone=blog_limit burst=10 nodelay;
        proxy_pass http://$ru_upstream;
        proxy_set_header Host subpolare.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 504 =503 @reaction_unavailable;
    }
    location @reaction_unavailable {
        default_type text/plain;
        return 503 "Реакции временно недоступны. Статью можно читать.\n";
    }

    location / {
        limit_req zone=blog_limit burst=50 nodelay;
        proxy_pass http://$blog_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
