# Successful hashed image responses only. Empty values suppress the header.
# No immutable caching for errors, upload endpoints, or Pepic's HTML pages.
map "$status:$sent_http_content_type:$uri" $pepic_image_cache {
    default "";
    "~^(200|206):image/[^:]+:/(?:[0-9]+/|full/)?[a-f0-9]{64}\.(?:jpg|jpeg|png|webp|gif|avif)$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name media.subpolare.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.subpolare.ru;

    ssl_certificate     /etc/letsencrypt/live/media.subpolare.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.subpolare.ru/privkey.pem;

    charset utf-8;
    client_max_body_size 500M;

    location / {
        add_header Cache-Control $pepic_image_cache;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        send_timeout 300;

        proxy_redirect off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8118;
    }
}
