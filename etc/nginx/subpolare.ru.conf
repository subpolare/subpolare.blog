limit_req_zone $binary_remote_addr zone=subpolare_blog_limit:10m rate=3r/s;

server {
    server_name www.subpolare.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    return 301 https://subpolare.ru$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/subpolare.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/subpolare.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name subpolare.ru;

    charset utf-8;
    client_max_body_size 15M;
    index index.html index.htm;

    set_real_ip_from  172.17.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    rewrite ^/logo.ico$ https://subpolare.ru/static/images/logo.ico;
    rewrite ^/logo.png$ https://subpolare.ru/static/images/logo_32.png;

    location /static/ {
        root /srv/subpolare/subpolare.blog/frontend/;
        gzip_static on;
        expires max;
        add_header Cache-Control "public";
    }

    location / {
        limit_req zone=subpolare_blog_limit burst=50 nodelay;

        add_header "Access-Control-Allow-Origin" "*";
        add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS";
        add_header "Access-Control-Allow-Headers" "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        add_header "Access-Control-Expose-Headers" "Content-Length,Content-Range";

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;

        proxy_pass http://0.0.0.0:8022;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/subpolare.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/subpolare.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}


server {
    if ($host = subpolare.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name subpolare.ru;
    return 404; # managed by Certbot


}

server {
    if ($host = www.subpolare.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.subpolare.ru;
    return 404; # managed by Certbot
}