server {
    listen 80;
    server_name supolare.ru www.supolare.ru;

    # Serve ACME challenge files for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name supolare.ru www.supolare.ru;

    ssl_certificate /etc/letsencrypt/live/supolare.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supolare.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/supolare.ru/chain.pem;

    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 32m;

    # Serve collected static files directly
    location /static/ {
        alias /var/www/static/;
    }

    # Serve uploaded media
    location /media/ {
        alias /var/www/media/;
    }

    # Proxy everything else to the Django application
    location / {
        proxy_pass http://blog_app:8022;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
