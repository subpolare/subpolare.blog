services:
  blog_app:
    image: subpolareblog-blog_app
    build: 
      context: .
      dockerfile: Dockerfile
    command: make docker-run-production
    container_name: blog_app
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=false
      - PEPIC_STORAGE_ROOT=/pepic-media
      - POSTGRES_DB=subpolare_ru
      - POSTGRES_USER=subpolare
      - POSTGRES_PASSWORD=${BLOG_DATABASE_PASSWORD:?Set BLOG_DATABASE_PASSWORD}
      - POSTGRES_HOST=postgres
      - SENTRY_DSN
    env_file:
      - .env
    restart: always
    volumes:
      - ./frontend/static:/tmp/static
      - /srv/pepic/uploads:/pepic-media:ro
      - ./runtime:/mirror-runtime:ro
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8022:8022"
    logging:
      driver: "json-file"
      options:
        max-size: "100M"
        max-file: "3"

  blog_previews:
    image: subpolareblog-blog_app
    command: poetry run python3 manage.py warm_homepage_previews --interval 3600
    container_name: blog_previews
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=false
      - PEPIC_STORAGE_ROOT=/pepic-media
      - POSTGRES_DB=subpolare_ru
      - POSTGRES_USER=subpolare
      - POSTGRES_PASSWORD=${BLOG_DATABASE_PASSWORD:?Set BLOG_DATABASE_PASSWORD}
      - POSTGRES_HOST=postgres
    env_file:
      - .env
    restart: always
    volumes:
      - /srv/pepic/uploads:/pepic-media:ro
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10M"
        max-file: "3"

  postgres:
    image: postgres:15
    command: postgres -c wal_level=logical -c max_slot_wal_keep_size=1GB
    container_name: blog_postgres
    restart: always
    environment:
      POSTGRES_USER: subpolare
      POSTGRES_PASSWORD: ${BLOG_DATABASE_PASSWORD:?Set BLOG_DATABASE_PASSWORD}
      POSTGRES_DB: subpolare_ru
    volumes:
      - /home/subpolare/pgdata_subpolare_ru:/var/lib/postgresql/data:rw
    ports:
      - "127.0.0.1:54324:5432"

  blog_maintenance:
    image: subpolareblog-blog_app
    command: python3 manage.py mirror_maintenance
    env_file: [.env]
    environment:
      DEBUG: "false"
      SITE_REGION: ru
    restart: always
    volumes: ["./runtime:/mirror-runtime"]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  blog_media_sync:
    image: subpolareblog-blog_app
    command: python3 manage.py mirror_media_sync
    user: "1000:1000"
    env_file: [.env]
    environment:
      DEBUG: "false"
      SITE_REGION: ru
      POSTGRES_DB: subpolare_ru
      POSTGRES_USER: blog_media_worker
      POSTGRES_PASSWORD: ${BLOG_MEDIA_PASSWORD:?Set BLOG_MEDIA_PASSWORD}
      POSTGRES_HOST: postgres
    restart: always
    volumes:
      - ./secrets/media:/mirror-secrets:ro
      - /srv/pepic/uploads:/pepic-media:ro
      - /srv/i.subpolare.ru/images:/legacy-images:ro
      - /srv/i.subpolare.ru/videos:/legacy-videos:ro
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
