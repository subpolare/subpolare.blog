services:
  blog_app:
    image: subpolareblog-blog_app
    build: 
      context: .
      dockerfile: Dockerfile
    command: make docker-run-production
    container_name: blog_app
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=false
      - PEPIC_STORAGE_ROOT=/pepic-media
      - POSTGRES_DB=subpolare_ru
      - POSTGRES_USER=subpolare
      - POSTGRES_PASSWORD=subpolare
      - POSTGRES_HOST=postgres
      - SENTRY_DSN
      - EMAIL_HOST
      - EMAIL_HOST_USER
      - EMAIL_HOST_PASSWORD
    env_file:
      - .env
    restart: always
    volumes:
      - ./frontend/static:/tmp/static
      - /srv/pepic/uploads:/pepic-media:ro
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8022:8022"
    logging:
      driver: "json-file"
      options:
        max-size: "100M"
        max-file: "3"

  blog_previews:
    image: subpolareblog-blog_app
    command: poetry run python3 manage.py warm_homepage_previews --interval 3600
    container_name: blog_previews
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=false
      - PEPIC_STORAGE_ROOT=/pepic-media
      - POSTGRES_DB=subpolare_ru
      - POSTGRES_USER=subpolare
      - POSTGRES_PASSWORD=subpolare
      - POSTGRES_HOST=postgres
    env_file:
      - .env
    restart: always
    volumes:
      - /srv/pepic/uploads:/pepic-media:ro
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10M"
        max-file: "3"

  postgres:
    image: postgres:15
    container_name: blog_postgres
    restart: always
    environment:
      POSTGRES_USER: subpolare
      POSTGRES_PASSWORD: subpolare
      POSTGRES_DB: subpolare_ru
    volumes:
      - /home/subpolare/pgdata_subpolare_ru:/var/lib/postgresql/data:rw
    ports:
      - "127.0.0.1:54324:5432"
